name: ANINEXUS Insta Check & Send

on:
  # هر ۱۲ ساعت: ۰۶:۰۰ و ۱۸:۰۰ به وقت تهران (UTC+3:30) = ۰۲:۳۰ و ۱۴:۳۰ UTC
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:
    inputs:
      pages_file:
        description: 'مسیر فایل لیست پیج‌ها'
        required: false
        default: 'aninexus_pages.json'
        type: string
      chat_id:
        description: 'chat_id مقصد در تلگرام (کانال ANINEXUS)'
        required: false
        default: '-1003135845875'
        type: string

permissions:
  contents: write

# دو ران هم‌زمان نباشن (state پیج‌ها و پست‌های زمان‌بندی‌شده قاطی نشه)
concurrency:
  group: aninexus-insta-check
  cancel-in-progress: false

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run check & send
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PROXY_URL: ${{ secrets.IG_PROXY_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN2 }}
        run: |
          python scripts/aninexus_insta_check.py \
            --pages-file "${{ inputs.pages_file || 'aninexus_pages.json' }}" \
            --chat-id "${{ inputs.chat_id || '-1003135845875' }}"
