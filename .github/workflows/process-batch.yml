name: Process batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'batch id (از بات)'
        required: true
        type: string
      message_id:
        description: 'message id فایل batch توی گروه خصوصی'
        required: true
        type: string

permissions:
  contents: read

# هم‌زمان فقط یک ران با سشن تلگرام (جلوگیری از AuthKeyDuplicated). ران‌های منتظر کنسل نمی‌شن
# (ولی گیت‌هاب فقط «یکی» منتظر رو نگه می‌داره؛ اگه گم شد، بات بعد از چند ساعت هشدار می‌ده و
# state جلو نرفته، پس پست‌ها دفعه‌ی بعد دوباره گرفته می‌شن).
concurrency:
  group: process-batch
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Process batch
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          BATCH_CHAT_ID: ${{ secrets.BATCH_CHAT_ID }}
          IG_PROXY_URL: ${{ secrets.IG_PROXY_URL }}
          INPUT_BATCH_ID: ${{ inputs.batch_id }}
          INPUT_MESSAGE_ID: ${{ inputs.message_id }}
        run: |
          python scripts/process_batch.py \
            --batch-id "$INPUT_BATCH_ID" \
            --message-id "$INPUT_MESSAGE_ID"
