name: Check New Posts (Apify) and Dispatch Download

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'یوزرنیم پروفایل اینستاگرام (بدون @)'
        required: true
        type: string
      chat_id:
        description: 'chat_id مقصد (پیش‌نمایش یا کانال نهایی، بسته به mode)'
        required: true
        type: string
      days:
        description: 'چند روز گذشته چک بشه'
        required: false
        type: string
        default: '2'
      max_posts:
        description: 'حداکثر پست در هر چک (کم = مصرف کمتر Apify)'
        required: false
        type: string
        default: '5'
      mode:
        description: 'preview = پیش‌نمایش برای تایید | send = ارسال مستقیم به کانال'
        required: false
        type: string
        default: 'preview'
  schedule:
    # هر ۶ ساعت یه‌بار — برای کم کردن مصرف Apify می‌تونی این رو کمتر کنی
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  check-new-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Apify-based post check
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ secrets.RETRY_PAT }}
        run: |
          python scripts/check_new_posts_apify.py \
            --profile "${{ inputs.profile || vars.MONITORED_PROFILE }}" \
            --chat-id "${{ inputs.chat_id || vars.REVIEW_CHAT_ID }}" \
            --days "${{ inputs.days || '2' }}" \
            --max-posts "${{ inputs.max_posts || '5' }}" \
            --mode "${{ inputs.mode || 'preview' }}" \
            --seen-file data/seen_posts.json \
            --repo "${{ github.repository }}"

      - name: Commit updated seen_posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_posts.json
          git diff --staged --quiet && echo "چیزی برای کامیت نیست." || git commit -m "chore: update seen_posts.json [skip ci]"
          git push
