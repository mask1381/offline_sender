name: Download and Send to Telegram (Instagram)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک پست اینستاگرام برای دانلود'
        required: true
        type: string
      chat_id:
        description: 'chat_id مقصد واقعی در تلگرام (حالا همیشه چت خودت/بات)'
        required: true
        type: string
      caption_channel_id:
        description: 'فقط برای انتخاب فرمت کپشن استفاده می‌شه (کانالی که با دکمه انتخاب کردی) - مقصد ارسال رو تغییر نمی‌ده'
        required: false
        type: string
        default: ''
      slides:
        description: 'شماره اسلایدهای انتخابی برای پست کروسل (مثلا 2,4) - خالی بذار یعنی همه'
        required: false
        type: string
        default: ''
      mode:
        description: 'preview = فرستادن همه اسلایدها برای تایید | send = ارسال نهایی اسلایدهای انتخابی'
        required: false
        type: string
        default: 'send'
      crop:
        description: 'true/false — فقط تو mode=send اعمال می‌شه؛ تصمیمش با دکمه‌ی کراپ تو preview گرفته شده'
        required: false
        type: string
        default: 'false'
      username:
        description: 'یوزرنیم پیج منبع، فقط اگه از پایش خودکار اومده (برای ثبت تو register-slide)'
        required: false
        type: string
        default: ''
        
permissions:
  actions: write
  contents: read

jobs:
  download-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Instagram session (optional)
        run: |
          if [ -z "${{ secrets.INSTAGRAM_SESSION_B64 }}" ]; then
            echo "ℹ️ secret INSTAGRAM_SESSION_B64 تنظیم نشده — اجرا به‌صورت anonymous (بدون لاگین) ادامه پیدا می‌کنه."
            echo "IG_SESSION_ARG=" >> "$GITHUB_ENV"
          else
            echo "${{ secrets.INSTAGRAM_SESSION_B64 }}" | base64 -d > ig_session.bin
            echo "IG_SESSION_ARG=--ig-session ig_session.bin" >> "$GITHUB_ENV"
          fi

      - name: Run download & send script
        id: download
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          REGISTER_SLIDE_WEBHOOK_URL: ${{ secrets.REGISTER_SLIDE_WEBHOOK_URL }}
        run: |
          python scripts/download_and_send.py \
            --url "${{ inputs.url }}" \
            --chat-id "${{ inputs.chat_id }}" \
            --caption-channel-id "${{ inputs.caption_channel_id }}" \
            ${{ env.IG_SESSION_ARG }} \
            --slides "${{ inputs.slides }}" \
            --mode "${{ inputs.mode }}" \
            --crop "${{ inputs.crop }}" \
            --username "${{ inputs.username }}"
