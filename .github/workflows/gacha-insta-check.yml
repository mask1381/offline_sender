name: Gacha Insta Check & Send

on:
  workflow_dispatch:
    inputs:
      pages_file:
        description: 'مسیر فایل pages.json (برای پروژه‌های دیگه قابل تغییره)'
        required: false
        default: 'pages.json'
        type: string
      chat_id:
        description: 'chat_id مقصد در تلگرام'
        required: false
        default: '-1002718837879'
        type: string
      caption_mode:
        description: 'channel = قالب کانال با تشخیص نوع پست | raw = کپشن دست‌نخورده'
        required: false
        default: 'channel'
        type: string

permissions:
  contents: write

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run check & send
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PROXY_URL: ${{ secrets.IG_PROXY_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/gacha_insta_check.py \
            --pages-file "${{ inputs.pages_file }}" \
            --chat-id "${{ inputs.chat_id }}" \
            --caption-mode "${{ inputs.caption_mode }}"
